name: Prime Motion APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Fixed Prime Motion
        run: |
          unzip -q PrimeMotion_Editing_Workspace_0_3_Fixed.zip -d extracted
          echo "Prime Motion extracted successfully"

      - name: Configure Gradle
        run: |
          cd extracted/PrimeMotion
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.workers.max=1" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Build Prime Motion APK
        run: |
          cd extracted/PrimeMotion
          gradle --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" \
            :app:assembleDebug --stacktrace

      - name: Upload Prime Motion APK
        uses: actions/upload-artifact@v4
        with:
          name: Prime-Motion-0.3-Fixed-APK
          path: extracted/PrimeMotion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
